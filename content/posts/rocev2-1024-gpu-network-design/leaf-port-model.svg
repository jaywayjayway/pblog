<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">128×400G 交换机的 Leaf 端口模型</title>
  <desc id="desc">单台 Leaf 使用六十四个四百G端口连接两个 Rail 中的六十四个服务器端点，并使用六十四个四百G端口连接八台 Spine。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <style>.title{font:700 40px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 24px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:700 16px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.tiny{font:500 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.down{fill:#073047;stroke:#22d3ee;stroke-width:2}.up{fill:#211b43;stroke:#a78bfa;stroke-width:2}.lineA{fill:none;stroke:#22d3ee;stroke-width:4}.lineB{fill:none;stroke:#a78bfa;stroke-width:4}</style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <g opacity=".12" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
  <text x="72" y="68" class="title">一台 Leaf 的 128×400G 逻辑端口怎样分</text>
  <text x="72" y="106" class="sub">64 下联 + 64 上联 = 1:1；端口数、交换容量和 breakout 能力必须同时成立</text>

  <rect x="70" y="150" width="1460" height="560" rx="30" class="card"/>
  <rect x="625" y="365" width="350" height="135" rx="28" fill="#10283d" stroke="#38bdf8" stroke-width="3"/>
  <text x="800" y="407" text-anchor="middle" class="head">Leaf 01</text>
  <text x="800" y="442" text-anchor="middle" class="label">128×400G · 51.2Tbps</text>
  <text x="800" y="470" text-anchor="middle" class="tiny">64 Downlink + 64 Uplink</text>

  <rect x="110" y="210" width="280" height="100" rx="22" class="down"/>
  <text x="250" y="249" text-anchor="middle" class="head">Rail 0</text><text x="250" y="280" text-anchor="middle" class="tiny">Node000～031 · 32×400G</text>
  <rect x="430" y="210" width="280" height="100" rx="22" class="down"/>
  <text x="570" y="249" text-anchor="middle" class="head">Rail 1</text><text x="570" y="280" text-anchor="middle" class="tiny">Node000～031 · 32×400G</text>
  <path d="M250 310C250 360 430 425 625 425M570 310C570 350 610 365 650 390" class="lineA"/>
  <rect x="110" y="555" width="600" height="105" rx="24" class="down"/>
  <text x="410" y="596" text-anchor="middle" class="head">服务器侧：64×400G = 25.6Tbps</text>
  <text x="410" y="630" text-anchor="middle" class="tiny">两个 Rail，各接入同一组 32 台服务器</text>
  <path d="M625 465C530 500 470 525 410 555" class="lineA"/>

  <g>
    <rect x="1020" y="190" width="180" height="58" rx="16" class="up"/><text x="1110" y="225" text-anchor="middle" class="label">Spine 01 · 8 链路</text>
    <rect x="1240" y="190" width="180" height="58" rx="16" class="up"/><text x="1330" y="225" text-anchor="middle" class="label">Spine 02 · 8 链路</text>
    <rect x="1020" y="275" width="180" height="58" rx="16" class="up"/><text x="1110" y="310" text-anchor="middle" class="label">Spine 03 · 8 链路</text>
    <rect x="1240" y="275" width="180" height="58" rx="16" class="up"/><text x="1330" y="310" text-anchor="middle" class="label">Spine 04 · 8 链路</text>
    <rect x="1020" y="530" width="180" height="58" rx="16" class="up"/><text x="1110" y="565" text-anchor="middle" class="label">Spine 07 · 8 链路</text>
    <rect x="1240" y="530" width="180" height="58" rx="16" class="up"/><text x="1330" y="565" text-anchor="middle" class="label">Spine 08 · 8 链路</text>
    <text x="1220" y="455" text-anchor="middle" class="head">…</text>
  </g>
  <path d="M975 395C1020 330 1060 290 1110 248M975 420C1080 350 1230 290 1330 248M975 445C1040 475 1080 500 1110 530M975 470C1100 500 1230 520 1330 530" class="lineB"/>
  <rect x="890" y="625" width="560" height="58" rx="22" class="up"/>
  <text x="1170" y="661" text-anchor="middle" class="head">Spine 侧：8×8×400G = 25.6Tbps</text>

  <rect x="135" y="755" width="1330" height="95" rx="25" fill="#0b1b2e" stroke="#334155"/>
  <text x="800" y="793" text-anchor="middle" class="head">1024 端点 ÷ 64 下联 = 16 Leaf；16 Leaf × 64 上联 ÷ 128 = 8 Spine</text>
  <text x="800" y="824" text-anchor="middle" class="tiny">若改成 2:1，可把每 Leaf 上联减到 32×400G，但最坏跨 Leaf 流量只能获得一半聚合容量</text>
</svg>
