<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">RoCEv2 端到端 RDMA 建连全过程</title>
  <desc id="desc">A 端 10.1.1.1 与 B 端 10.1.1.2 从服务监听、地址解析、QP 创建、RDMA CM 握手到 RDMA Write 和完成通知的全过程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker>
    <style>.title{font:700 40px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 24px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:700 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.body{font:500 16px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#cbd5e1}.tiny{font:500 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.step{font:700 16px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#071525}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.cyanCard{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.purpleCard{fill:#211b43;stroke:#a78bfa;stroke-width:2}.lifeC{stroke:#22d3ee;stroke-width:3;stroke-dasharray:8 10;opacity:.65}.lifeP{stroke:#a78bfa;stroke-width:3;stroke-dasharray:8 10;opacity:.65}.arrowC{fill:none;stroke:#22d3ee;stroke-width:4;marker-end:url(#arrowC)}.arrowP{fill:none;stroke:#a78bfa;stroke-width:4;marker-end:url(#arrowP)}.arrowD{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#arrowC)}</style>
  </defs>
  <rect width="1600" height="1100" rx="32" fill="url(#bg)"/>
  <g opacity=".12" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M0 900H1600M0 1050H1600"/><path d="M200 0V1100M400 0V1100M600 0V1100M800 0V1100M1000 0V1100M1200 0V1100M1400 0V1100"/></g>

  <text x="72" y="68" class="title">RoCEv2：从 IP 地址到可执行 RDMA Write 的 RC 连接</text>
  <text x="72" y="106" class="sub">同网段示例：A 端 10.1.1.1/24 主动连接 B 端 10.1.1.2/24；RDMA CM 建连不等于 TCP 三次握手</text>

  <rect x="90" y="145" width="420" height="104" rx="24" class="cyanCard"/>
  <rect x="590" y="145" width="420" height="104" rx="24" class="card"/>
  <rect x="1090" y="145" width="420" height="104" rx="24" class="purpleCard"/>
  <rect x="118" y="168" width="78" height="34" rx="17" fill="url(#cyan)"/><text x="157" y="191" text-anchor="middle" class="step">A 端</text>
  <text x="220" y="190" class="head">10.1.1.1</text><text x="118" y="225" class="body">主动端 · Client · RC QP</text>
  <text x="800" y="187" text-anchor="middle" class="head">Ethernet / IP Fabric</text><text x="800" y="221" text-anchor="middle" class="body">ARP · L2/L3 转发 · QoS · ECN/PFC</text>
  <rect x="1118" y="168" width="78" height="34" rx="17" fill="url(#purple)"/><text x="1157" y="191" text-anchor="middle" class="step">B 端</text>
  <text x="1220" y="190" class="head">10.1.1.2</text><text x="1118" y="225" class="body">被动端 · Server · RC QP</text>

  <line x1="300" y1="265" x2="300" y2="960" class="lifeC"/><line x1="800" y1="265" x2="800" y2="960" stroke="#475569" stroke-width="3" stroke-dasharray="8 10"/><line x1="1300" y1="265" x2="1300" y2="960" class="lifeP"/>

  <circle cx="1300" cy="306" r="18" fill="url(#purple)"/><text x="1300" y="312" text-anchor="middle" class="step">1</text>
  <rect x="1040" y="278" width="430" height="78" rx="18" class="purpleCard"/>
  <text x="1065" y="309" class="label">服务端监听</text><text x="1065" y="337" class="tiny">bind 10.1.1.2:&lt;service-port&gt; → listen</text>

  <circle cx="300" cy="405" r="18" fill="url(#cyan)"/><text x="300" y="411" text-anchor="middle" class="step">2</text>
  <rect x="130" y="375" width="385" height="84" rx="18" class="cyanCard"/>
  <text x="155" y="407" class="label">地址解析</text><text x="155" y="436" class="tiny">resolve_addr → ARP → ADDR_RESOLVED</text>
  <path d="M515 424H1270" class="arrowC"/><text x="795" y="399" text-anchor="middle" class="body">ARP：Who has 10.1.1.2?</text>
  <path d="M1270 452H540" class="arrowP"/><text x="800" y="476" text-anchor="middle" class="tiny">返回 B 的 MAC；跨网段时解析下一跳网关 MAC</text>

  <circle cx="300" cy="530" r="18" fill="url(#cyan)"/><text x="300" y="536" text-anchor="middle" class="step">3</text>
  <rect x="130" y="500" width="385" height="82" rx="18" class="cyanCard"/>
  <text x="155" y="532" class="label">A 创建资源并解析路径</text><text x="155" y="560" class="tiny">PD/CQ/QP/MR → resolve_route</text>
  <rect x="1085" y="500" width="385" height="82" rx="18" class="purpleCard"/>
  <text x="1110" y="532" class="label">B 的监听 CM ID 等待请求</text><text x="1110" y="560" class="tiny">连接资源在 CONNECT_REQUEST 后创建</text>

  <circle cx="800" cy="630" r="18" fill="#64748b"/><text x="800" y="636" text-anchor="middle" class="label">4</text>
  <path d="M330 616H1270" class="arrowC"/><text x="800" y="602" text-anchor="middle" class="label">CM REQ：rdma_connect()</text>
  <path d="M1270 661H330" class="arrowP"/><text x="800" y="650" text-anchor="middle" class="label">CM REP：新 cm_id → 创建 QP → rdma_accept()</text>
  <path d="M330 704H1270" class="arrowC"/><text x="800" y="694" text-anchor="middle" class="label">CM RTU：双方 ESTABLISHED · QP 可收发</text>
  <text x="800" y="729" text-anchor="middle" class="tiny">协议层简化视图；应用处理 CM 事件，不建立 TCP 连接</text>

  <circle cx="800" cy="790" r="18" fill="#64748b"/><text x="800" y="796" text-anchor="middle" class="label">5</text>
  <path d="M1270 784H330" class="arrowP"/><text x="800" y="773" text-anchor="middle" class="label">交换 MR 元数据：remote_addr · rkey · length</text>
  <text x="800" y="819" text-anchor="middle" class="tiny">可使用 CM Private Data，或连接建立后的 Send/Receive 控制消息</text>

  <circle cx="800" cy="885" r="18" fill="#64748b"/><text x="800" y="891" text-anchor="middle" class="label">6</text>
  <path d="M330 875H1270" class="arrowC"/><text x="800" y="862" text-anchor="middle" class="label">RDMA Write：UDP dport 4791 · BTH · First/Only 含 RETH · ICRC · FCS</text>
  <path d="M1270 918H330" class="arrowP"/><text x="800" y="908" text-anchor="middle" class="body">RC ACK；丢包时按 PSN 检测并重试</text>
  <rect x="130" y="932" width="385" height="62" rx="18" class="cyanCard"/><text x="322" y="970" text-anchor="middle" class="label">Signaled WR → A 端 CQE</text>
  <rect x="1085" y="932" width="385" height="62" rx="18" class="purpleCard"/><text x="1277" y="970" text-anchor="middle" class="label">RNIC DMA → B 端目标 MR</text>

  <rect x="90" y="1020" width="1420" height="46" rx="20" fill="#0b1b2e" stroke="#334155"/>
  <circle cx="124" cy="1043" r="7" fill="#22d3ee"/><text x="145" y="1049" class="body">控制面：解析、建连与权限交换</text>
  <circle cx="510" cy="1043" r="7" fill="#a78bfa"/><text x="531" y="1049" class="body">数据面：RNIC 执行 DMA 与 RC 可靠传输</text>
  <text x="1478" y="1049" text-anchor="end" class="tiny">CQE 不自动等同于远端应用已消费数据</text>
</svg>
