<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">InfiniBand 与 RoCEv2 协议栈对比</title>
  <desc id="desc">两者共享 RDMA verbs 和 InfiniBand Transport 语义，但底层承载、寻址、路由和管理机制不同。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient><style>.title{font:700 40px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 25px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:700 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.tiny{font:500 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.ib{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.roce{fill:#211b43;stroke:#a78bfa;stroke-width:2}</style></defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/><g opacity=".12" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
  <text x="72" y="72" class="title">相同的 RDMA 编程模型，不同的网络承载</text><text x="72" y="108" class="sub">应用侧都使用 QP、CQ、MR 与 verbs；差异集中在 Fabric 的封装、寻址、路由和拥塞控制</text>
  <rect x="240" y="150" width="1120" height="86" rx="26" fill="#0b2c46" stroke="#38bdf8"/><text x="800" y="187" text-anchor="middle" class="head">应用 / 通信库：NCCL · MPI · NVMe-oF · 自研服务</text><text x="800" y="216" text-anchor="middle" class="tiny">libibverbs / rdma_cm · PD · MR · QP · CQ</text>
  <rect x="85" y="280" width="680" height="510" rx="32" class="card"/><rect x="835" y="280" width="680" height="510" rx="32" class="card"/>
  <rect x="115" y="305" width="180" height="44" rx="22" fill="url(#cyan)"/><text x="205" y="334" text-anchor="middle" class="label">InfiniBand</text>
  <rect x="865" y="305" width="180" height="44" rx="22" fill="url(#purple)"/><text x="955" y="334" text-anchor="middle" class="label">RoCEv2</text>
  <g><rect x="145" y="390" width="560" height="72" rx="17" class="ib"/><text x="425" y="420" text-anchor="middle" class="head">InfiniBand Transport</text><text x="425" y="447" text-anchor="middle" class="tiny">RC / UC / UD · BTH · RC 提供 ACK / Retry</text>
  <rect x="145" y="485" width="560" height="72" rx="17" class="ib"/><text x="425" y="515" text-anchor="middle" class="head">IB Network</text><text x="425" y="542" text-anchor="middle" class="tiny">LID / GID · P_Key · SM 下发路由</text>
  <rect x="145" y="580" width="560" height="72" rx="17" class="ib"/><text x="425" y="610" text-anchor="middle" class="head">IB Link</text><text x="425" y="637" text-anchor="middle" class="tiny">SL / VL · Credit-based Flow Control</text>
  <rect x="145" y="675" width="560" height="72" rx="17" class="ib"/><text x="425" y="718" text-anchor="middle" class="head">IB HCA · IB Switch · IB PHY</text></g>
  <g><rect x="895" y="390" width="560" height="72" rx="17" class="roce"/><text x="1175" y="420" text-anchor="middle" class="head">InfiniBand Transport</text><text x="1175" y="447" text-anchor="middle" class="tiny">RC / UC / UD · BTH · RC 提供 ACK / Retry</text>
  <rect x="895" y="485" width="560" height="72" rx="17" class="roce"/><text x="1175" y="515" text-anchor="middle" class="head">UDP / IP</text><text x="1175" y="542" text-anchor="middle" class="tiny">UDP dst 4791 · IP / GID · L3 可路由</text>
  <rect x="895" y="580" width="560" height="72" rx="17" class="roce"/><text x="1175" y="610" text-anchor="middle" class="head">Ethernet</text><text x="1175" y="637" text-anchor="middle" class="tiny">VLAN · PCP / DSCP · ECN · 可选 PFC</text>
  <rect x="895" y="675" width="560" height="72" rx="17" class="roce"/><text x="1175" y="718" text-anchor="middle" class="head">RNIC · Ethernet Switch · Ethernet PHY</text></g>
  <text x="425" y="775" text-anchor="middle" class="tiny">管理核心：Subnet Manager / UFM</text><text x="1175" y="775" text-anchor="middle" class="tiny">管理核心：IP 路由、QoS 与交换机自动化</text>
  <rect x="240" y="828" width="1120" height="44" rx="20" fill="#0b1b2e" stroke="#334155"/><text x="800" y="856" text-anchor="middle" class="tiny">RoCEv1 只在二层承载；RoCEv2 通过 UDP/IP 获得三层可路由能力</text>
</svg>
