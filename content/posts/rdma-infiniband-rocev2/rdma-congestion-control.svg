<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">InfiniBand 与 RoCEv2 流控及拥塞反馈</title><desc id="desc">InfiniBand 使用信用流控保护相邻链路，RoCEv2 使用 ECN、CNP、端点拥塞控制和可选 PFC 共同处理拥塞。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker><style>.title{font:700 40px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 25px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:700 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.tiny{font:500 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.ib{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.roce{fill:#211b43;stroke:#a78bfa;stroke-width:2}.c{fill:none;stroke:#22d3ee;stroke-width:4;marker-end:url(#aC)}.p{fill:none;stroke:#a78bfa;stroke-width:4;marker-end:url(#aP)}.dash{stroke-dasharray:10 9}</style></defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/><g opacity=".12" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
  <text x="72" y="72" class="title">流控防止缓冲溢出，拥塞控制负责让发送端降速</text><text x="72" y="108" class="sub">两者解决的问题不同：没有合理的拥塞控制，所谓“无损”也可能变成长时间排队和反压</text>
  <rect x="70" y="155" width="700" height="650" rx="30" class="card"/><rect x="830" y="155" width="700" height="650" rx="30" class="card"/>
  <text x="420" y="210" text-anchor="middle" class="head">InfiniBand</text><text x="1180" y="210" text-anchor="middle" class="head">RoCEv2</text>
  <rect x="115" y="310" width="170" height="82" rx="18" class="ib"/><rect x="335" y="310" width="170" height="82" rx="18" class="ib"/><rect x="555" y="310" width="170" height="82" rx="18" class="ib"/>
  <text x="200" y="360" text-anchor="middle" class="label">发送 HCA</text><text x="420" y="350" text-anchor="middle" class="label">IB Switch</text><text x="420" y="375" text-anchor="middle" class="tiny">入口 / 出口缓冲</text><text x="640" y="360" text-anchor="middle" class="label">接收 HCA</text>
  <path d="M285 338H335M505 338H555" class="c"/><path d="M555 378H505M335 378H285" class="c dash"/>
  <text x="420" y="280" text-anchor="middle" class="tiny">数据</text><text x="420" y="425" text-anchor="middle" class="tiny">逐跳 Credit：有可用接收缓冲才继续发送</text>
  <rect x="115" y="500" width="610" height="170" rx="22" fill="#0b1b2e" stroke="#334155"/><text x="420" y="540" text-anchor="middle" class="label">Credit-based Flow Control ≠ 没有拥塞</text><text x="420" y="577" text-anchor="middle" class="tiny">热点仍会形成排队和反压</text><text x="420" y="608" text-anchor="middle" class="tiny">需要路由规划、自适应路由与 IB 拥塞控制协同</text><text x="420" y="639" text-anchor="middle" class="tiny">观察：PortXmitWait、错误计数、路径与拥塞遥测</text>

  <rect x="875" y="310" width="170" height="82" rx="18" class="roce"/><rect x="1095" y="310" width="170" height="82" rx="18" class="roce"/><rect x="1315" y="310" width="170" height="82" rx="18" class="roce"/>
  <text x="960" y="360" text-anchor="middle" class="label">发送 RNIC</text><text x="1180" y="350" text-anchor="middle" class="label">Ethernet Switch</text><text x="1180" y="375" text-anchor="middle" class="tiny">队列达到 ECN 阈值</text><text x="1400" y="360" text-anchor="middle" class="label">接收 RNIC</text>
  <path d="M1045 338H1095M1265 338H1315" class="p"/><text x="1180" y="280" text-anchor="middle" class="tiny">数据 · ECN 标记</text>
  <path d="M1315 430C1210 475 1080 475 960 430" class="p dash"/><text x="1180" y="490" text-anchor="middle" class="tiny">CNP：接收端把拥塞信号反馈给发送端</text>
  <rect x="875" y="540" width="610" height="130" rx="22" fill="#0b1b2e" stroke="#334155"/><text x="1180" y="580" text-anchor="middle" class="label">发送端拥塞控制主动调速</text><text x="1180" y="615" text-anchor="middle" class="tiny">ECN + CNP + DCQCN 或其他端点算法</text><text x="1180" y="645" text-anchor="middle" class="tiny">PFC 可按优先级逐跳暂停，但不是所有 RoCEv2 模式都启用</text>
  <rect x="170" y="730" width="1260" height="46" rx="20" fill="#0b2c46" stroke="#38bdf8"/><text x="800" y="759" text-anchor="middle" class="tiny">验收不能只看“是否丢包”：还要同时观察队列、Pause、ECN/CNP、重试、吞吐与尾延迟</text>
</svg>
