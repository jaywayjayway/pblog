<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">NCCL 普通近端路径、PXN 与错误跨 Rail 路径</title>
  <desc id="desc">两台多 GPU 节点之间，通过多 Rail Clos 网络对比 GPU 使用近端 NIC、借助中间 GPU 使用非本地 NIC，以及错误跨 Rail 的路径。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f59e0b"/></marker>
    <style>.title{font:700 40px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 22px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:700 17px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.tiny{font:500 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.gpu{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.nic{fill:#211b43;stroke:#a78bfa;stroke-width:2}.net{fill:#15233a;stroke:#64748b;stroke-width:2}.local{fill:none;stroke:#22d3ee;stroke-width:6;marker-end:url(#arrowC)}.pxn{fill:none;stroke:#a78bfa;stroke-width:6;marker-end:url(#arrowP)}.bad{fill:none;stroke:#f59e0b;stroke-width:5;stroke-dasharray:11 9;marker-end:url(#arrowO)}</style>
  </defs>
  <rect width="1600" height="950" rx="32" fill="url(#bg)"/>
  <g opacity=".12" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M0 900H1600"/><path d="M200 0V950M400 0V950M600 0V950M800 0V950M1000 0V950M1200 0V950M1400 0V950"/></g>
  <text x="72" y="68" class="title">NCCL 的最终路径由 GPU-NIC 亲和与目标 Rail 共同决定</text>
  <text x="72" y="106" class="sub">近端 GDR 直接出网；PXN 经 NVLink 借用中间 GPU 的近端 NIC；错误映射可能跨 Socket 或跨 Rail</text>

  <rect x="55" y="150" width="480" height="660" rx="30" class="card"/><rect x="1065" y="150" width="480" height="660" rx="30" class="card"/>
  <rect x="80" y="175" width="160" height="42" rx="21" fill="url(#cyan)"/><text x="160" y="203" text-anchor="middle" class="label">节点 A</text>
  <rect x="1090" y="175" width="160" height="42" rx="21" fill="url(#purple)"/><text x="1170" y="203" text-anchor="middle" class="label">节点 B</text>

  <rect x="95" y="275" width="170" height="78" rx="20" class="gpu"/><text x="180" y="307" text-anchor="middle" class="head">GPU 0</text><text x="180" y="334" text-anchor="middle" class="tiny">近 RNIC 0</text>
  <rect x="325" y="275" width="170" height="78" rx="20" class="gpu"/><text x="410" y="307" text-anchor="middle" class="head">GPU 3</text><text x="410" y="334" text-anchor="middle" class="tiny">近 RNIC 3</text>
  <rect x="95" y="440" width="170" height="78" rx="20" class="nic"/><text x="180" y="472" text-anchor="middle" class="head">RNIC 0</text><text x="180" y="499" text-anchor="middle" class="tiny">Rail 0</text>
  <rect x="325" y="440" width="170" height="78" rx="20" class="nic"/><text x="410" y="472" text-anchor="middle" class="head">RNIC 3</text><text x="410" y="499" text-anchor="middle" class="tiny">Rail 3</text>
  <path d="M180 353V440" class="local"/><text x="195" y="402" class="tiny">近端 PCIe</text>
  <path d="M180 335C250 370 330 350 410 353V440" class="pxn"/><text x="305" y="370" text-anchor="middle" class="tiny">PXN：NVLink 到中间 GPU</text>
  <path d="M410 353C500 385 500 415 265 478" class="bad"/><text x="388" y="410" text-anchor="middle" class="tiny">错误跨 Root 路径</text>
  <rect x="105" y="600" width="380" height="110" rx="22" fill="#0b1b2e" stroke="#334155"/><text x="295" y="637" text-anchor="middle" class="label">节点内选择</text><text x="295" y="670" text-anchor="middle" class="tiny">物理距离 + GDR + Channel + 远端 Rail</text><text x="295" y="696" text-anchor="middle" class="tiny">NCCL 版本与网络插件也会影响结果</text>

  <rect x="1105" y="275" width="170" height="78" rx="20" class="gpu"/><text x="1190" y="307" text-anchor="middle" class="head">GPU 0</text><text x="1190" y="334" text-anchor="middle" class="tiny">目标 Rank</text>
  <rect x="1335" y="275" width="170" height="78" rx="20" class="gpu"/><text x="1420" y="307" text-anchor="middle" class="head">GPU 3</text><text x="1420" y="334" text-anchor="middle" class="tiny">目标 Rank</text>
  <rect x="1105" y="440" width="170" height="78" rx="20" class="nic"/><text x="1190" y="472" text-anchor="middle" class="head">RNIC 0</text><text x="1190" y="499" text-anchor="middle" class="tiny">Rail 0</text>
  <rect x="1335" y="440" width="170" height="78" rx="20" class="nic"/><text x="1420" y="472" text-anchor="middle" class="head">RNIC 3</text><text x="1420" y="499" text-anchor="middle" class="tiny">Rail 3</text>
  <path d="M1190 440V353" class="local"/><path d="M1420 440V353" class="pxn"/>
  <rect x="1115" y="600" width="380" height="110" rx="22" fill="#0b1b2e" stroke="#334155"/><text x="1305" y="637" text-anchor="middle" class="label">同步落点</text><text x="1305" y="670" text-anchor="middle" class="tiny">最慢 Rail、Rank 或 Chunk</text><text x="1305" y="696" text-anchor="middle" class="tiny">决定 Collective 的尾部完成时间</text>

  <rect x="585" y="205" width="430" height="510" rx="30" class="card"/><text x="800" y="248" text-anchor="middle" class="head">Rail-Optimized Clos</text>
  <rect x="625" y="305" width="350" height="78" rx="20" class="net"/><text x="800" y="337" text-anchor="middle" class="head">Leaf / Plane 0</text><text x="800" y="364" text-anchor="middle" class="tiny">对应 RNIC 0</text>
  <rect x="625" y="505" width="350" height="78" rx="20" class="net"/><text x="800" y="537" text-anchor="middle" class="head">Leaf / Plane 3</text><text x="800" y="564" text-anchor="middle" class="tiny">对应 RNIC 3</text>
  <rect x="680" y="405" width="240" height="60" rx="20" class="net"/><text x="800" y="442" text-anchor="middle" class="label">Spine / Fabric</text>
  <path d="M535 479H625M975 344H1065" class="local"/><path d="M535 479C570 520 590 544 625 544M975 544H1065" class="pxn"/>
  <path d="M535 478C590 430 590 344 625 344M975 344C1025 380 1025 479 1065 479" class="bad"/>

  <rect x="150" y="845" width="1300" height="62" rx="24" fill="#0b1b2e" stroke="#334155"/>
  <circle cx="205" cy="876" r="8" fill="#22d3ee"/><text x="226" y="882" class="tiny">近端 GDR</text><circle cx="430" cy="876" r="8" fill="#a78bfa"/><text x="451" y="882" class="tiny">PXN / 目标 Rail</text><circle cx="735" cy="876" r="8" fill="#f59e0b"/><text x="756" y="882" class="tiny">错误映射或绕行</text><text x="1415" y="882" text-anchor="end" class="tiny">路径为原理示意，不代表 NCCL 必然采用固定 GPU/NIC 编号</text>
</svg>
