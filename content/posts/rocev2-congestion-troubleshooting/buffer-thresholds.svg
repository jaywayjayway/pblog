<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">ECN、PFC 和 Headroom 的逻辑关系</title>
  <desc id="desc">左侧展示出口队列的 ECN 标记区间，右侧展示入口优先级组的 PFC XOFF、XON 和 Headroom；强调两者可能属于不同缓存域。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#164e63"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#312e81"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker>
    <style>.title{font:700 40px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 24px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:700 17px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.tiny{font:500 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:9 7}.arrow{fill:none;stroke:#38bdf8;stroke-width:4;marker-end:url(#a)}</style>
  </defs>
  <rect width="1600" height="940" rx="32" fill="url(#bg)"/>
  <g opacity=".12" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M0 900H1600M200 0V940M400 0V940M600 0V940M800 0V940M1000 0V940M1200 0V940M1400 0V940"/></g>
  <text x="72" y="68" class="title">先反馈、后保护：但 ECN 与 PFC 未必共享一根水位尺</text>
  <text x="72" y="106" class="sub">出口 TC / Queue 负责标记拥塞 · 入口 PG / Headroom 负责吸收 Pause 生效前的在途数据</text>

  <rect x="70" y="150" width="700" height="620" rx="30" class="card"/>
  <text x="420" y="205" text-anchor="middle" class="head">出口缓存域：ECN 标记</text>
  <rect x="185" y="280" width="310" height="380" rx="18" fill="#081827" stroke="#475569" stroke-width="2"/>
  <rect x="185" y="530" width="310" height="130" rx="0" fill="url(#cyan)" opacity=".85"/>
  <rect x="185" y="400" width="310" height="130" fill="#0e7490" opacity=".62"/>
  <rect x="185" y="320" width="310" height="80" fill="#be123c" opacity=".72"/>
  <path d="M155 530H530M155 400H530M155 320H530" class="dash"/>
  <text x="535" y="538" class="label">Kmin</text><text x="535" y="408" class="label">Kmax</text><text x="535" y="328" class="label">队列极限 / Drop</text>
  <text x="340" y="605" text-anchor="middle" class="label">低水位</text><text x="340" y="475" text-anchor="middle" class="label">概率或渐进标记 CE</text><text x="340" y="365" text-anchor="middle" class="label">持续标记 / 可能丢弃</text>
  <text x="420" y="715" text-anchor="middle" class="tiny">具体是瞬时、平均或动态阈值，由 ASIC 实现决定</text>

  <rect x="830" y="150" width="700" height="620" rx="30" class="card"/>
  <text x="1180" y="205" text-anchor="middle" class="head">入口缓存域：PFC 与 Headroom</text>
  <rect x="945" y="280" width="310" height="380" rx="18" fill="#081827" stroke="#475569" stroke-width="2"/>
  <rect x="945" y="500" width="310" height="160" fill="url(#purple)" opacity=".82"/>
  <rect x="945" y="390" width="310" height="110" fill="#7c3aed" opacity=".65"/>
  <rect x="945" y="320" width="310" height="70" fill="#be123c" opacity=".72"/>
  <path d="M915 535H1290M915 500H1290M915 390H1290M915 320H1290" class="dash"/>
  <text x="1295" y="543" class="label">XON</text><text x="1295" y="508" class="label">XOFF</text><text x="1295" y="398" class="label">Headroom 上沿</text><text x="1295" y="328" class="label">Headroom Drop</text>
  <text x="1100" y="595" text-anchor="middle" class="label">普通无损缓冲</text><text x="1100" y="455" text-anchor="middle" class="label">Headroom 吸收在途数据</text><text x="1100" y="365" text-anchor="middle" class="label">保护能力耗尽</text>
  <text x="1180" y="715" text-anchor="middle" class="tiny">XOFF / XON 保留回差，减少 Pause / Resume 振荡</text>

  <path d="M640 450C760 350 835 350 930 450" class="arrow"/>
  <text x="790" y="330" text-anchor="middle" class="label">工程目标</text><text x="790" y="355" text-anchor="middle" class="tiny">ECN 反馈在 Headroom 耗尽前生效</text>

  <rect x="170" y="810" width="1260" height="78" rx="24" fill="#0b1b2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="800" y="842" text-anchor="middle" class="label">不能直接比较两个数值：先确认 ASIC 的入口、出口、共享池和计量单位</text>
  <text x="800" y="869" text-anchor="middle" class="tiny">Headroom ≈ 链路速率 × Pause 闭环时间 + 设备内部余量；400G 每 1μs 约产生 50KB 在途数据</text>
</svg>
