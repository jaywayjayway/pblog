<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">RoCEv2 排障核心术语与端到端路径</title>
  <desc id="desc">从发送端 GPU 和 NCCL Rank，经本地 RNIC、Leaf、Spine、远端 Leaf 与 RNIC，到接收端 GPU 的数据路径，并标注 Rail、Fabric、TC 队列、PG Headroom、ECN CNP DCQCN 与 PFC 所在层次。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c084fc"/></marker>
    <style>.title{font:700 40px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 22px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:700 17px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.tiny{font:500 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.gpu{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.nic{fill:#112943;stroke:#38bdf8;stroke-width:2}.sw{fill:#211b43;stroke:#a78bfa;stroke-width:2}.path{fill:none;stroke:#22d3ee;stroke-width:5;marker-end:url(#ac)}.feedback{fill:none;stroke:#c084fc;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#ap)}.rail{fill:none;stroke:#22d3ee;stroke-width:2;stroke-dasharray:8 7}.pill{fill:#172554;stroke:#6366f1;stroke-width:1.5}</style>
  </defs>
  <rect width="1600" height="920" rx="32" fill="url(#bg)"/>
  <g opacity=".12" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M200 0V920M400 0V920M600 0V920M800 0V920M1000 0V920M1200 0V920M1400 0V920"/></g>
  <text x="72" y="70" class="title">先把术语放回真实路径</text>
  <text x="72" y="108" class="sub">GPU / NCCL → RNIC → Leaf-Spine Fabric → RNIC / GPU</text>

  <rect x="65" y="150" width="1470" height="410" rx="30" class="card"/>
  <rect x="92" y="180" width="1416" height="346" rx="25" class="rail"/>
  <rect x="95" y="290" width="160" height="105" rx="22" class="gpu"/>
  <text x="175" y="330" text-anchor="middle" class="head">GPU A</text><text x="175" y="360" text-anchor="middle" class="tiny">NCCL Rank 0</text><text x="175" y="382" text-anchor="middle" class="tiny">AllReduce 数据</text>
  <rect x="295" y="290" width="160" height="105" rx="22" class="nic"/>
  <text x="375" y="330" text-anchor="middle" class="head">RNIC A</text><text x="375" y="360" text-anchor="middle" class="tiny">发送端 RP</text><text x="375" y="382" text-anchor="middle" class="tiny">DCQCN 调速</text>
  <rect x="495" y="290" width="160" height="105" rx="22" class="sw"/>
  <text x="575" y="330" text-anchor="middle" class="head">Leaf A</text><text x="575" y="360" text-anchor="middle" class="tiny">TC / Queue</text><text x="575" y="382" text-anchor="middle" class="tiny">PG / Headroom</text>
  <rect x="695" y="290" width="160" height="105" rx="22" class="sw"/>
  <text x="775" y="330" text-anchor="middle" class="head">Spine</text><text x="775" y="360" text-anchor="middle" class="tiny">ECMP 转发</text><text x="775" y="382" text-anchor="middle" class="tiny">Fabric 核心</text>
  <rect x="895" y="290" width="160" height="105" rx="22" class="sw"/>
  <text x="975" y="330" text-anchor="middle" class="head">Leaf B</text><text x="975" y="360" text-anchor="middle" class="tiny">热点出口标记 CE</text><text x="975" y="382" text-anchor="middle" class="tiny">PFC 逐跳保护</text>
  <rect x="1095" y="290" width="160" height="105" rx="22" class="nic"/>
  <text x="1175" y="330" text-anchor="middle" class="head">RNIC B</text><text x="1175" y="360" text-anchor="middle" class="tiny">接收端 NP</text><text x="1175" y="382" text-anchor="middle" class="tiny">收到 CE，返回 CNP</text>
  <rect x="1295" y="290" width="160" height="105" rx="22" class="gpu"/>
  <text x="1375" y="330" text-anchor="middle" class="head">GPU B</text><text x="1375" y="360" text-anchor="middle" class="tiny">NCCL Rank 1</text><text x="1375" y="382" text-anchor="middle" class="tiny">接收并参与归约</text>
  <path d="M255 325H295M455 325H495M655 325H695M855 325H895M1055 325H1095M1255 325H1295" class="path"/>
  <path d="M1095 430C900 505 570 505 375 410" class="feedback"/>
  <text x="850" y="482" text-anchor="middle" class="label">CE 随数据到达接收端 · CNP 端到端返回发送端</text>
  <rect x="95" y="205" width="360" height="48" rx="24" fill="url(#cyan)"/>
  <text x="275" y="236" text-anchor="middle" class="label">Rail：对应 RNIC 与路径的逻辑通道</text>
  <rect x="495" y="205" width="560" height="48" rx="24" fill="url(#purple)"/>
  <text x="775" y="236" text-anchor="middle" class="label">Fabric：Leaf、Spine 及其互联链路</text>

  <rect x="65" y="600" width="455" height="240" rx="28" class="card"/>
  <rect x="90" y="625" width="178" height="40" rx="20" fill="url(#cyan)"/><text x="179" y="651" text-anchor="middle" class="label">通信对象</text>
  <text x="100" y="710" class="tiny">• Rank：集合通信参与者</text><text x="100" y="746" class="tiny">• AllReduce：归约并向全部 Rank 分发</text><text x="100" y="782" class="tiny">• algbw / busbw：性能比较指标</text><text x="100" y="818" class="tiny">• 不直接等同于端口线速</text>

  <rect x="572" y="600" width="455" height="240" rx="28" class="card"/>
  <rect x="597" y="625" width="178" height="40" rx="20" fill="url(#purple)"/><text x="686" y="651" text-anchor="middle" class="label">队列与缓存</text>
  <text x="607" y="710" class="tiny">• 微突发 / Incast：热点形成方式</text><text x="607" y="746" class="tiny">• 出口 TC / Queue：排队与 ECN 标记</text><text x="607" y="782" class="tiny">• 入口 PG / Headroom：无损缓冲</text><text x="607" y="818" class="tiny">• 入口、出口不是同一个缓存对象</text>

  <rect x="1074" y="600" width="461" height="240" rx="28" class="card"/>
  <rect x="1099" y="625" width="190" height="40" rx="20" class="pill"/><text x="1194" y="651" text-anchor="middle" class="label">反馈与保护</text>
  <text x="1109" y="710" class="tiny">• ECN / CE：拥塞点显式标记</text><text x="1109" y="746" class="tiny">• CNP / DCQCN：端到端反馈与调速</text><text x="1109" y="782" class="tiny">• PFC / Pause：相邻链路逐跳保护</text><text x="1109" y="818" class="tiny">• 反馈控速与缓冲保护职责不同</text>
</svg>
