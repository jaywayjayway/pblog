<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">单 Rail 拥塞及 PFC 扩散</title>
  <desc id="desc">八条 Rail 中 Rail 5 的热点出口反馈迟缓，PFC 从接收侧 Leaf 向 Spine 和发送侧 Leaf 扩散，最终使一组 Rank 变慢并拖住 Collective。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker>
    <style>.title{font:700 40px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 24px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:700 17px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.tiny{font:500 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.node{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.sw{fill:#211b43;stroke:#a78bfa;stroke-width:2}.hot{fill:#3f1425;stroke:#fb7185;stroke-width:3}.ok{fill:none;stroke:#22d3ee;stroke-width:3;opacity:.65;marker-end:url(#ac)}.bad{fill:none;stroke:#fb7185;stroke-width:5;marker-end:url(#ar)}.pause{fill:none;stroke:#fb7185;stroke-width:4;stroke-dasharray:8 8;marker-end:url(#ar)}</style>
  </defs>
  <rect width="1600" height="940" rx="32" fill="url(#bg)"/>
  <g opacity=".12" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M0 900H1600M200 0V940M400 0V940M600 0V940M800 0V940M1000 0V940M1200 0V940M1400 0V940"/></g>
  <text x="72" y="68" class="title">一条 Rail 变慢，整个 Collective 都要等它</text>
  <text x="72" y="106" class="sub">Rail 5 出口热点 → ECN 反馈迟缓 → 入口 Headroom → PFC 逐跳扩散</text>

  <rect x="70" y="150" width="1460" height="620" rx="30" class="card"/>
  <text x="260" y="205" text-anchor="middle" class="head">发送节点组</text><text x="800" y="205" text-anchor="middle" class="head">Clos Fabric</text><text x="1340" y="205" text-anchor="middle" class="head">接收节点组</text>
  <rect x="120" y="275" width="280" height="390" rx="28" class="node"/><text x="260" y="320" text-anchor="middle" class="head">Node 000～031</text><text x="260" y="350" text-anchor="middle" class="tiny">8 GPU · 8 RNIC / Node</text>
  <g class="tiny"><text x="165" y="405">Rail 0</text><text x="165" y="445">Rail 1</text><text x="165" y="485">Rail 2</text><text x="165" y="525">Rail 3</text><text x="165" y="565">Rail 4</text><text x="165" y="605" fill="#fda4af">Rail 5 · 慢 Rank</text><text x="165" y="645">Rail 6 / 7</text></g>
  <rect x="510" y="295" width="220" height="110" rx="22" class="sw"/><text x="620" y="340" text-anchor="middle" class="head">Leaf A</text><text x="620" y="372" text-anchor="middle" class="tiny">发送侧</text>
  <rect x="690" y="500" width="220" height="110" rx="22" class="sw"/><text x="800" y="545" text-anchor="middle" class="head">Spine</text><text x="800" y="577" text-anchor="middle" class="tiny">ECMP</text>
  <rect x="870" y="295" width="220" height="110" rx="22" class="hot"/><text x="980" y="340" text-anchor="middle" class="head">Leaf B</text><text x="980" y="370" text-anchor="middle" class="tiny">Rail 5 热点出口</text>
  <rect x="1200" y="275" width="280" height="390" rx="28" class="node"/><text x="1340" y="320" text-anchor="middle" class="head">Node 096～127</text><text x="1340" y="350" text-anchor="middle" class="tiny">接收侧 incast</text>
  <g class="tiny"><text x="1245" y="405">Rail 0</text><text x="1245" y="445">Rail 1</text><text x="1245" y="485">Rail 2</text><text x="1245" y="525">Rail 3</text><text x="1245" y="565">Rail 4</text><text x="1245" y="605" fill="#fda4af">Rail 5 · Queue 抬升</text><text x="1245" y="645">Rail 6 / 7</text></g>

  <path d="M400 410C470 410 480 350 510 350M730 350C770 410 790 470 800 500M910 555C940 490 960 445 980 405M1090 350C1140 350 1160 410 1200 410" class="ok"/>
  <path d="M400 600C520 600 565 405 620 405C700 405 710 540 800 555C900 570 925 405 980 405C1080 405 1110 600 1200 600" class="bad"/>
  <text x="800" y="690" text-anchor="middle" class="label" fill="#fda4af">数据：Rail 5 向热点出口汇聚</text>
  <path d="M930 420C920 455 900 485 870 505" class="pause"/><path d="M730 505C700 475 670 440 640 410" class="pause"/><path d="M510 330C455 285 420 300 385 365" class="pause"/>
  <text x="800" y="255" text-anchor="middle" class="label" fill="#fda4af">PFC 反向逐跳传播</text>

  <rect x="170" y="810" width="1260" height="78" rx="24" fill="#0b1b2e" stroke="#fb7185" stroke-width="2"/>
  <text x="800" y="842" text-anchor="middle" class="label">AllReduce 由最慢 Rank 决定完成时间</text><text x="800" y="869" text-anchor="middle" class="tiny">排障必须比较各 Rail，而不是只看全网平均利用率或全部端口的聚合 PFC</text>
</svg>
