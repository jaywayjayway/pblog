<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">两台节点的进程、Rank 与 GPU 映射</title><desc id="desc">node rank、local rank、global rank、Python 进程和 GPU 的映射规则。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="p" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient><style>.t{font:700 40px system-ui,"PingFang SC";fill:#f8fafc}.s{font:400 18px system-ui,"PingFang SC";fill:#94a3b8}.h{font:700 22px system-ui,"PingFang SC";fill:#f8fafc}.l{font:650 16px system-ui,"PingFang SC";fill:#f8fafc}.x{font:500 14px system-ui,"PingFang SC";fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.row{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.row2{fill:#211b43;stroke:#a78bfa;stroke-width:2}</style></defs><rect width="1600" height="900" rx="32" fill="url(#bg)"/><text x="70" y="70" class="t">16 个进程怎样映射到 16 张 GPU</text><text x="70" y="108" class="s">global_rank = node_rank × 8 + local_rank；GPU 与 HCA 的亲和不能按编号猜测</text>
  <rect x="70" y="155" width="1460" height="90" rx="26" class="card"/><text x="800" y="192" text-anchor="middle" class="h">torchrun --nnodes=2 --nproc-per-node=8</text><text x="800" y="224" text-anchor="middle" class="x">每台机器启动 8 个 Python 进程，每个进程绑定唯一 LOCAL_RANK / CUDA Device</text>
  <rect x="70" y="285" width="700" height="470" rx="28" class="card"/><rect x="830" y="285" width="700" height="470" rx="28" class="card"/><rect x="95" y="310" width="230" height="42" rx="21" fill="url(#c)"/><text x="210" y="338" text-anchor="middle" class="l">node-a · node_rank=0</text><rect x="855" y="310" width="230" height="42" rx="21" fill="url(#p)"/><text x="970" y="338" text-anchor="middle" class="l">node-b · node_rank=1</text>
  <g class="x"><text x="110" y="390">Python 进程</text><text x="290" y="390">LOCAL_RANK</text><text x="450" y="390">GLOBAL RANK</text><text x="640" y="390">CUDA</text><text x="870" y="390">Python 进程</text><text x="1050" y="390">LOCAL_RANK</text><text x="1210" y="390">GLOBAL RANK</text><text x="1400" y="390">CUDA</text></g>
  <g class="l"><rect x="95" y="415" width="650" height="48" rx="14" class="row"/><text x="120" y="445">PID A0</text><text x="330" y="445">0</text><text x="500" y="445">0</text><text x="665" y="445">GPU 0</text><rect x="95" y="477" width="650" height="48" rx="14" class="row"/><text x="120" y="507">PID A1</text><text x="330" y="507">1</text><text x="500" y="507">1</text><text x="665" y="507">GPU 1</text><text x="420" y="570" text-anchor="middle">⋮</text><rect x="95" y="590" width="650" height="48" rx="14" class="row"/><text x="120" y="620">PID A7</text><text x="330" y="620">7</text><text x="500" y="620">7</text><text x="665" y="620">GPU 7</text>
  <rect x="855" y="415" width="650" height="48" rx="14" class="row2"/><text x="880" y="445">PID B0</text><text x="1090" y="445">0</text><text x="1260" y="445">8</text><text x="1425" y="445">GPU 0</text><rect x="855" y="477" width="650" height="48" rx="14" class="row2"/><text x="880" y="507">PID B1</text><text x="1090" y="507">1</text><text x="1260" y="507">9</text><text x="1425" y="507">GPU 1</text><text x="1180" y="570" text-anchor="middle">⋮</text><rect x="855" y="590" width="650" height="48" rx="14" class="row2"/><text x="880" y="620">PID B7</text><text x="1090" y="620">7</text><text x="1260" y="620">15</text><text x="1425" y="620">GPU 7</text></g>
  <rect x="185" y="685" width="1225" height="120" rx="25" fill="#171f35" stroke="#f59e0b" stroke-width="2"/><text x="800" y="725" text-anchor="middle" class="h">编号相同 ≠ 物理亲和</text><text x="800" y="760" text-anchor="middle" class="l">GPU 3 与 mlx5_3 是否近端，必须用 nvidia-smi topo -m、lspci -tv 和 OEM 拓扑验证</text><text x="800" y="789" text-anchor="middle" class="x">Rank 是软件身份 · GPU 是计算设备 · HCA/Rail 是网络路径</text></svg>
