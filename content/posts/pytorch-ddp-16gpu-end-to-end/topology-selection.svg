<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc"><title id="title">Ring、Tree、P2P 与 NVLS 的角色关系</title><desc id="desc">NCCL 初始化时发现拓扑并同时建立多套候选路径，运行期依据操作、消息大小和调优模型选择。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="p" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient><style>.t{font:700 40px system-ui,"PingFang SC";fill:#f8fafc}.s{font:400 18px system-ui,"PingFang SC";fill:#94a3b8}.h{font:700 22px system-ui,"PingFang SC";fill:#f8fafc}.l{font:650 16px system-ui,"PingFang SC";fill:#f8fafc}.x{font:500 14px system-ui,"PingFang SC";fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.cyan{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.purple{fill:#211b43;stroke:#a78bfa;stroke-width:2}.green{fill:#123229;stroke:#34d399;stroke-width:2}.line{stroke:#64748b;stroke-width:4}</style></defs><rect width="1600" height="930" rx="32" fill="url(#bg)"/><text x="70" y="70" class="t">拓扑先同时建好，算法再按 Collective 动态选择</text><text x="70" y="108" class="s">“Connected”证明候选路径就绪，不代表训练中的每次 AllReduce 都使用同一算法</text>
  <rect x="110" y="165" width="1380" height="110" rx="28" class="card"/><rect x="145" y="198" width="260" height="44" rx="22" fill="url(#c)"/><text x="275" y="227" text-anchor="middle" class="l">NCCL INIT / GRAPH</text><text x="465" y="214" class="h">输入：GPU、NVSwitch、PCIe、HCA、Rail 与 Rank 拓扑</text><text x="465" y="246" class="x">构建 Ring、Tree、P2P、NVLS 等可用图，并完成连接</text><path d="M800 275V345" class="line"/>
  <g><rect x="90" y="345" width="330" height="260" rx="28" class="cyan"/><rect x="455" y="345" width="330" height="260" rx="28" class="purple"/><rect x="820" y="345" width="330" height="260" rx="28" class="green"/><rect x="1185" y="345" width="330" height="260" rx="28" class="card"/></g><g class="h" text-anchor="middle"><text x="255" y="395">Ring</text><text x="620" y="395">Tree</text><text x="985" y="395">NVLS / NVLSTree</text><text x="1350" y="395">P2P Channel</text></g><g class="x" text-anchor="middle"><text x="255" y="445">带宽友好的流水线闭环</text><text x="255" y="480">本例：4 coll channels</text><text x="255" y="515">包含两条跨机 RoCE 边</text><text x="620" y="445">分层 Reduce / Broadcast</text><text x="620" y="480">本例：4 组 Tree 已连接</text><text x="620" y="515">不是 Ring 失败后的回退</text><text x="985" y="445">NVSwitch multicast / 归约</text><text x="985" y="480">本例：16 NVLS channels</text><text x="985" y="515">Channel ≠ NIC / Rail</text><text x="1350" y="445">send / recv 点对点路径</text><text x="1350" y="480">本例：4 P2P channels</text><text x="1350" y="515">与 Collective 算法概念不同</text></g>
  <path d="M255 605V690M620 605V690M985 605V690M1350 605V690" class="line"/><rect x="250" y="690" width="1100" height="135" rx="30" class="card"/><rect x="285" y="720" width="210" height="44" rx="22" fill="url(#p)"/><text x="390" y="749" text-anchor="middle" class="l">运行期选择</text><text x="540" y="740" class="h">Collective 类型 + 消息大小 + 协议阈值 + 硬件能力 + 调优模型</text><text x="800" y="792" text-anchor="middle" class="x">需要 COLL/TRACE 日志或 NCCL 对照实验，才能证明某一次操作最终用了什么</text><rect x="460" y="850" width="680" height="42" rx="20" fill="#17233a" stroke="#f59e0b"/><text x="800" y="878" text-anchor="middle" class="l">不要把逻辑 Channel 数量换算成物理网卡数量</text></svg>
