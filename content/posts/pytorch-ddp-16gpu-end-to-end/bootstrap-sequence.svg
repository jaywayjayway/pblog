<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">torchrun Rendezvous、NCCL Bootstrap 与数据面的时序</title><desc id="desc">两节点启动、等待、组成进程组、交换 NCCL 元数据并建立 RoCE 数据通道的时序。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60a5fa"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e879f9"/></marker><style>.t{font:700 40px system-ui,"PingFang SC";fill:#f8fafc}.s{font:400 18px system-ui,"PingFang SC";fill:#94a3b8}.h{font:700 22px system-ui,"PingFang SC";fill:#f8fafc}.l{font:650 16px system-ui,"PingFang SC";fill:#f8fafc}.x{font:500 14px system-ui,"PingFang SC";fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.life{stroke:#64748b;stroke-width:3;stroke-dasharray:8 8}.ctl{stroke:#60a5fa;stroke-width:4;marker-end:url(#b)}.data{stroke:#e879f9;stroke-width:5;marker-end:url(#p)}</style></defs><rect width="1600" height="980" rx="32" fill="url(#bg)"/><text x="70" y="70" class="t">启动慢，不一定是 NCCL 建链慢</text><text x="70" y="108" class="s">案例中主节点等待第二节点约 3 分 46 秒；成员到齐后 communicator 约 4 秒完成初始化</text>
  <g class="card"><rect x="85" y="155" width="310" height="72" rx="20"/><rect x="645" y="155" width="310" height="72" rx="20"/><rect x="1205" y="155" width="310" height="72" rx="20"/></g><g class="h" text-anchor="middle"><text x="240" y="199">node-a · rank 0–7</text><text x="800" y="199">Rendezvous / OOB</text><text x="1360" y="199">node-b · rank 8–15</text></g><path d="M240 227V890M800 227V890M1360 227V890" class="life"/>
  <circle cx="240" cy="285" r="10" fill="#22d3ee"/><text x="270" y="291" class="l">T+0：torchrun 启动</text><path d="M250 320H790" class="ctl"/><text x="520" y="305" text-anchor="middle" class="x">创建 Rendezvous：192.0.2.10:5678</text><rect x="120" y="350" width="240" height="90" rx="20" fill="#17233a" stroke="#f59e0b"/><text x="240" y="385" text-anchor="middle" class="l">等待成员</text><text x="240" y="416" text-anchor="middle" class="x">约 3 分 46 秒</text>
  <circle cx="1360" cy="475" r="10" fill="#c084fc"/><text x="1060" y="481" class="l">T+3m46s：node-b 启动</text><path d="M1350 510H810" class="ctl"/><text x="1080" y="495" text-anchor="middle" class="x">加入同一 Rendezvous</text><path d="M790 555H250M810 555H1350" class="ctl"/><text x="800" y="544" text-anchor="middle" class="x">下发 world_size=16 与 global rank</text>
  <rect x="530" y="600" width="540" height="82" rx="22" class="card"/><text x="800" y="634" text-anchor="middle" class="h">NCCL OOB Bootstrap · bond0</text><text x="800" y="663" text-anchor="middle" class="x">交换 commId、拓扑、rank 地址和 HCA 端点</text><path d="M250 640H530M1070 640H1350" class="ctl"/>
  <path d="M250 740H1350" class="data"/><text x="800" y="724" text-anchor="middle" class="l">建立 P2P / NVLS / NET/IB 通道</text><path d="M1350 790H250" class="data"/><text x="800" y="824" text-anchor="middle" class="x">跨机 Payload 进入 mlx5 RoCE，而不是 bond0</text>
  <g><circle cx="240" cy="875" r="10" fill="#34d399"/><circle cx="1360" cy="875" r="10" fill="#34d399"/></g><text x="800" y="882" text-anchor="middle" class="h">所有 rank：Init COMPLETE</text><rect x="385" y="910" width="830" height="45" rx="20" fill="#123229" stroke="#34d399"/><text x="800" y="939" text-anchor="middle" class="l">等待时间属于调度/启动阶段；成员到齐后的 NCCL 建链约 4 秒</text></svg>
