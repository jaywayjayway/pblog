<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc"><title id="title">一次 DDP 迭代从数据切分到参数更新的全链路</title><desc id="desc">两个节点的 rank 从数据采样、前向、反向到 bucket AllReduce 和参数更新。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e879f9"/></marker><style>.t{font:700 40px system-ui,"PingFang SC";fill:#f8fafc}.s{font:400 18px system-ui,"PingFang SC";fill:#94a3b8}.h{font:700 21px system-ui,"PingFang SC";fill:#f8fafc}.l{font:650 16px system-ui,"PingFang SC";fill:#f8fafc}.x{font:500 14px system-ui,"PingFang SC";fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.step{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.sync{fill:#211b43;stroke:#e879f9;stroke-width:2}.flow{fill:none;stroke:#22d3ee;stroke-width:4;marker-end:url(#a)}.net{fill:none;stroke:#e879f9;stroke-width:5;stroke-dasharray:10 8;marker-end:url(#p)}</style></defs><rect width="1600" height="930" rx="32" fill="url(#bg)"/><text x="70" y="70" class="t">一次 DDP 迭代：计算产生梯度，NCCL 负责同步</text><text x="70" y="108" class="s">Bucket 就绪即可发起 AllReduce，让通信与剩余 Backward 尽量重叠</text>
  <rect x="65" y="155" width="1470" height="115" rx="28" class="card"/><text x="105" y="198" class="h">① DistributedSampler</text><text x="105" y="230" class="x">1000 个样本按 16 Rank 切分 · per-rank batch size=32 · 每 Rank 每 Epoch 2 Batch</text><path d="M800 270V325" class="flow"/>
  <rect x="65" y="325" width="700" height="360" rx="30" class="card"/><rect x="835" y="325" width="700" height="360" rx="30" class="card"/><text x="415" y="370" text-anchor="middle" class="h">node-a · rank 0–7</text><text x="1185" y="370" text-anchor="middle" class="h">node-b · rank 8–15</text>
  <g class="step"><rect x="105" y="410" width="180" height="80" rx="20"/><rect x="325" y="410" width="180" height="80" rx="20"/><rect x="545" y="410" width="180" height="80" rx="20"/><rect x="875" y="410" width="180" height="80" rx="20"/><rect x="1095" y="410" width="180" height="80" rx="20"/><rect x="1315" y="410" width="180" height="80" rx="20"/></g><g class="l" text-anchor="middle"><text x="195" y="458">② Forward</text><text x="415" y="458">③ Backward</text><text x="635" y="446">Bucket</text><text x="635" y="468">Ready</text><text x="965" y="458">② Forward</text><text x="1185" y="458">③ Backward</text><text x="1405" y="446">Bucket</text><text x="1405" y="468">Ready</text></g><path d="M285 450H325M505 450H545M1055 450H1095M1275 450H1315" class="flow"/>
  <rect x="175" y="555" width="480" height="82" rx="22" class="sync"/><rect x="945" y="555" width="480" height="82" rx="22" class="sync"/><text x="415" y="587" text-anchor="middle" class="l">④ 节点内 P2P / NVLS</text><text x="415" y="615" text-anchor="middle" class="x">聚合本节点参与数据</text><text x="1185" y="587" text-anchor="middle" class="l">④ 节点内 P2P / NVLS</text><text x="1185" y="615" text-anchor="middle" class="x">聚合本节点参与数据</text><path d="M635 490L510 555M1405 490L1280 555" class="flow"/>
  <path d="M655 596H945" class="net"/><text x="800" y="579" text-anchor="middle" class="l">⑤ RNIC → RoCE Fabric → RNIC</text><path d="M945 620H655" class="net"/>
  <rect x="300" y="735" width="1000" height="100" rx="28" class="card"/><text x="800" y="775" text-anchor="middle" class="h">⑥ AllReduce 完成 → 所有 Rank 得到一致梯度 → Optimizer Step</text><text x="800" y="809" text-anchor="middle" class="x">同步 Collective 的完成时间受最慢 Rank、最慢 Bucket 和最慢 Rail 影响</text><path d="M415 637L650 735M1185 637L950 735" class="flow"/><rect x="410" y="860" width="780" height="42" rx="20" fill="#123229" stroke="#34d399"/><text x="800" y="888" text-anchor="middle" class="l">下一批次开始时，各 Rank 的模型参数保持一致</text></svg>
