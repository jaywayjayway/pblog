<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">16 Rank Ring 中的节点内与跨节点路径</title><desc id="desc">两个八卡节点形成一个 16-rank 闭环，节点内使用 P2P，跨节点边通过 RoCE。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e879f9"/></marker><style>.t{font:700 40px system-ui,"PingFang SC";fill:#f8fafc}.s{font:400 18px system-ui,"PingFang SC";fill:#94a3b8}.h{font:700 21px system-ui,"PingFang SC";fill:#f8fafc}.l{font:650 16px system-ui,"PingFang SC";fill:#f8fafc}.x{font:500 14px system-ui,"PingFang SC";fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.a{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.b{fill:#211b43;stroke:#a78bfa;stroke-width:2}.intra{fill:none;stroke:#34d399;stroke-width:5;marker-end:url(#g)}.inter{fill:none;stroke:#e879f9;stroke-width:6;stroke-dasharray:12 8;marker-end:url(#p)}</style></defs><rect width="1600" height="920" rx="32" fill="url(#bg)"/><text x="70" y="70" class="t">一条 Ring：尽量走长节点内段，只在两处跨机</text><text x="70" y="108" class="s">Channel 00–03 使用相同逻辑顺序并行切分数据；Channel 数量不等于物理 Rail 数量</text><rect x="60" y="155" width="650" height="610" rx="30" class="card"/><rect x="890" y="155" width="650" height="610" rx="30" class="card"/><text x="385" y="205" text-anchor="middle" class="h">node-a · P2P/CUMEM</text><text x="1215" y="205" text-anchor="middle" class="h">node-b · P2P/CUMEM</text>
  <g class="a"><circle cx="170" cy="310" r="48"/><circle cx="310" cy="310" r="48"/><circle cx="450" cy="310" r="48"/><circle cx="590" cy="310" r="48"/><circle cx="590" cy="560" r="48"/><circle cx="450" cy="560" r="48"/><circle cx="310" cy="560" r="48"/><circle cx="170" cy="560" r="48"/></g><g class="b"><circle cx="1000" cy="310" r="48"/><circle cx="1140" cy="310" r="48"/><circle cx="1280" cy="310" r="48"/><circle cx="1420" cy="310" r="48"/><circle cx="1420" cy="560" r="48"/><circle cx="1280" cy="560" r="48"/><circle cx="1140" cy="560" r="48"/><circle cx="1000" cy="560" r="48"/></g>
