<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">双机 16 卡 DDP 与 NCCL 训练全景</title><desc id="desc">两台八卡 H200 节点通过 bond0 控制面和八路 RoCE 数据面连接，节点内使用 NVSwitch。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="p" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e879f9"/></marker><style>.t{font:700 40px system-ui,"PingFang SC";fill:#f8fafc}.s{font:400 18px system-ui,"PingFang SC";fill:#94a3b8}.h{font:700 22px system-ui,"PingFang SC";fill:#f8fafc}.l{font:600 16px system-ui,"PingFang SC";fill:#e2e8f0}.x{font:500 14px system-ui,"PingFang SC";fill:#b6c2d3}.card{fill:#0c2035;stroke:#334155;stroke-width:2}.gpu{fill:#0b2a3c;stroke:#22d3ee;stroke-width:2}.nic{fill:#211b43;stroke:#a78bfa;stroke-width:2}.ctl{fill:none;stroke:#60a5fa;stroke-width:4;stroke-dasharray:10 8}.data{fill:none;stroke:#e879f9;stroke-width:5;marker-end:url(#a)}.local{stroke:#34d399;stroke-width:5}</style></defs>
  <rect width="1600" height="920" rx="32" fill="url(#bg)"/><g opacity=".1" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/><path d="M200 0V920M400 0V920M600 0V920M800 0V920M1000 0V920M1200 0V920M1400 0V920"/></g>
  <text x="70" y="70" class="t">双机 16 卡训练：控制面完成发现，数据面承载 Collective</text><text x="70" y="108" class="s">2 × H200 八卡节点 · 16 Rank · 8 HCA / 节点 · RoCEv2 Fabric</text>
  <rect x="55" y="160" width="530" height="585" rx="28" class="card"/><rect x="1015" y="160" width="530" height="585" rx="28" class="card"/><rect x="80" y="185" width="170" height="42" rx="21" fill="url(#c)"/><text x="165" y="213" text-anchor="middle" class="l">node-a · rank 0–7</text><rect x="1040" y="185" width="170" height="42" rx="21" fill="url(#p)"/><text x="1125" y="213" text-anchor="middle" class="l">node-b · rank 8–15</text>
