  <rect x="655" y="500" width="290" height="165" rx="26" class="card"/><rect x="685" y="525" width="230" height="48" rx="16" fill="url(#p)"/><text x="800" y="556" text-anchor="middle" class="l">Leaf-Spine Fabric</text><text x="800" y="606" text-anchor="middle" class="h">Rail 0 … Rail 7</text><text x="800" y="635" text-anchor="middle" class="x">RoCEv2 / NET/IB Payload</text><path d="M555 600H655M945 600H1045" class="data"/>
