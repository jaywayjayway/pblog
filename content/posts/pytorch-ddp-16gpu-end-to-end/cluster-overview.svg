  <use href="#ga" x="960"/><rect x="120" y="445" width="400" height="66" rx="18" fill="#123229" stroke="#34d399" stroke-width="2"/><text x="320" y="486" text-anchor="middle" class="h">NVSwitch · P2P / NVLS</text><rect x="1080" y="445" width="400" height="66" rx="18" fill="#123229" stroke="#34d399" stroke-width="2"/><text x="1280" y="486" text-anchor="middle" class="h">NVSwitch · P2P / NVLS</text><path d="M320 408V445M1280 408V445" class="local"/>
  <g class="nic"><rect x="85" y="565" width="470" height="72" rx="18"/><rect x="1045" y="565" width="470" height="72" rx="18"/></g><text x="320" y="596" text-anchor="middle" class="h">mlx5_0 … mlx5_7</text><text x="320" y="622" text-anchor="middle" class="x">8 个 RoCE HCA · 是否均衡需计数器验证</text><text x="1280" y="596" text-anchor="middle" class="h">mlx5_0 … mlx5_7</text><text x="1280" y="622" text-anchor="middle" class="x">8 个 RoCE HCA · 远端镜像配置</text>
