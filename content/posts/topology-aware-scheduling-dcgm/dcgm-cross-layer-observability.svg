<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#15112d"/></linearGradient><linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0d5260"/></linearGradient><linearGradient id="purple" x2="1" y2="1"><stop stop-color="#33235f"/><stop offset="1" stop-color="#50306d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#48d7e8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#eaf6ff}.title{font-size:38px;font-weight:700}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#c4d5e5}.sub{font-size:23px;fill:#9fb7ca}</style></defs><rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="70" y="78" class="title">DCGM 与网络观测：用身份和时间把证据串起来</text><text x="70" y="123" class="sub">独占完整 GPU 案例 · DCGM 不直接感知 NCCL Rank 或交换机队列</text><g><rect x="70" y="190" width="440" height="155" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="290" y="232" class="label" text-anchor="middle">作业与分配</text><text x="290" y="272" class="small" text-anchor="middle">Job / Run → Pod UID</text><text x="290" y="304" class="small" text-anchor="middle">Node → GPU UUID → Rank</text></g><g><rect x="580" y="190" width="440" height="155" rx="20" fill="url(#purple)" stroke="#a882ff" stroke-width="2"/><text x="800" y="232" class="label" text-anchor="middle">GPU：DCGM</text><text x="800" y="272" class="small" text-anchor="middle">利用率 / 显存 / 功率 / 健康</text><text x="800" y="304" class="small" text-anchor="middle">支持时增加 Profiling</text></g><g><rect x="1090" y="190" width="440" height="155" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="1310" y="232" class="label" text-anchor="middle">通信：NCCL / RNIC</text><text x="1310" y="272" class="small" text-anchor="middle">Collective / 连接 / 吞吐</text><text x="1310" y="304" class="small" text-anchor="middle">重传 / Rail / HCA</text></g><path d="M510 270 L575 270" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1020 270 L1085 270" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="70" y="465" width="440" height="170" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="290" y="507" class="label" text-anchor="middle">训练阶段</text><text x="290" y="547" class="small" text-anchor="middle">数据等待 / Forward / Backward</text><text x="290" y="579" class="small" text-anchor="middle">Step Time / 有效吞吐</text></g><g><rect x="580" y="465" width="440" height="170" rx="20" fill="url(#purple)" stroke="#a882ff" stroke-width="2"/><text x="800" y="507" class="label" text-anchor="middle">统一关联与时间轴</text><text x="800" y="547" class="small" text-anchor="middle">分配有效期 / 采集新鲜度</text><text x="800" y="579" class="small" text-anchor="middle">确认 Pod 标签真实归属</text></g><g><rect x="1090" y="465" width="440" height="170" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="1310" y="507" class="label" text-anchor="middle">Fabric</text><text x="1310" y="547" class="small" text-anchor="middle">Leaf / Spine / 端口 / 队列</text><text x="1310" y="579" class="small" text-anchor="middle">ECN / PFC / 丢弃</text></g><path d="M290 345 L290 460" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M800 345 L800 460" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1310 345 L1310 460" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M510 550 L575 550" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1085 550 L1025 550" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><text x="265" y="745" class="sub">GPU 利用率低只是线索；结合数据加载、Collective 与网络证据，再做受控对照</text><text x="70" y="850" class="sub">Exporter → Prometheus → Grafana；缺失指标不是零，共享 GPU / MIG 归因需要另行设计</text></svg>
