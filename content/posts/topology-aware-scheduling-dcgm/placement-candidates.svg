<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#15112d"/></linearGradient><linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0d5260"/></linearGradient><linearGradient id="purple" x2="1" y2="1"><stop stop-color="#33235f"/><stop offset="1" stop-color="#50306d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#48d7e8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#eaf6ff}.title{font-size:38px;font-weight:700}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#c4d5e5}.sub{font-size:23px;fill:#9fb7ca}</style></defs><rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="70" y="78" class="title">16 张空闲 GPU，不等于同一种资源组合</text><text x="70" y="123" class="sub">模拟算例 · 2 Worker × 每 Worker 8 GPU · 各对应 Rail 的接入关系需要同时核对</text><g><rect x="70" y="200" width="460" height="170" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="300" y="242" class="label" text-anchor="middle">A：同接入组</text><text x="300" y="282" class="small" text-anchor="middle">node-a：8 GPU 空闲</text><text x="300" y="314" class="small" text-anchor="middle">node-b：8 GPU 空闲</text></g><g><rect x="570" y="200" width="460" height="170" rx="20" fill="url(#purple)" stroke="#a882ff" stroke-width="2"/><text x="800" y="242" class="label" text-anchor="middle">B：跨接入组</text><text x="800" y="282" class="small" text-anchor="middle">node-c：8 GPU 空闲</text><text x="800" y="314" class="small" text-anchor="middle">node-d：8 GPU 空闲</text></g><g><rect x="1070" y="200" width="460" height="170" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="1300" y="242" class="label" text-anchor="middle">C：零散资源</text><text x="1300" y="282" class="small" text-anchor="middle">4 节点 × 每节点 4 GPU</text><text x="1300" y="314" class="small" text-anchor="middle">合计 16 GPU</text></g><path d="M300 370 L300 470" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M800 370 L800 470" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1300 370 L1300 470" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="70" y="480" width="460" height="190" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="300" y="522" class="label" text-anchor="middle">满足启动布局</text><text x="300" y="562" class="small" text-anchor="middle">核对健康、容量与背景负载</text><text x="300" y="594" class="small" text-anchor="middle">邻近只是候选优势</text></g><g><rect x="570" y="480" width="460" height="190" rx="20" fill="url(#purple)" stroke="#a882ff" stroke-width="2"/><text x="800" y="522" class="label" text-anchor="middle">满足启动布局</text><text x="800" y="562" class="small" text-anchor="middle">部分流量可能经过 Spine</text><text x="800" y="594" class="small" text-anchor="middle">性能差异需要实测</text></g><g><rect x="1070" y="480" width="460" height="190" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="1300" y="522" class="label" text-anchor="middle">不满足当前布局</text><text x="1300" y="562" class="small" text-anchor="middle">单个 Pod 需要完整 8 GPU</text><text x="1300" y="594" class="small" text-anchor="middle">改为 4×4 是另一套实验</text></g><text x="70" y="850" class="sub">同接入组 ≠ 所有 NIC 接同一台 Leaf；1:1 Fabric 中跨 Leaf 不必然显著变慢</text></svg>
