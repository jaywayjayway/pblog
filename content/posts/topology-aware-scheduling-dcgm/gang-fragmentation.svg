<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#15112d"/></linearGradient><linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0d5260"/></linearGradient><linearGradient id="purple" x2="1" y2="1"><stop stop-color="#33235f"/><stop offset="1" stop-color="#50306d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#48d7e8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#eaf6ff}.title{font-size:38px;font-weight:700}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#c4d5e5}.sub{font-size:23px;fill:#9fb7ca}</style></defs><rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="70" y="78" class="title">资源形状、Gang 与拓扑约束解决不同问题</text><text x="70" y="123" class="sub">本案例：两个 Worker Pod · 每个 Pod 8 GPU · minAvailable 为 2 个任务</text><g><rect x="80" y="205" width="440" height="235" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="300" y="247" class="label" text-anchor="middle">资源形状</text><text x="300" y="287" class="small" text-anchor="middle">4 节点各空闲 4 GPU</text><text x="300" y="319" class="small" text-anchor="middle">不能承载任一 8-GPU Pod</text><text x="300" y="351" class="small" text-anchor="middle">总空闲量足够仍会 Pending</text></g><g><rect x="580" y="205" width="440" height="235" rx="20" fill="url(#purple)" stroke="#a882ff" stroke-width="2"/><text x="800" y="247" class="label" text-anchor="middle">Gang 准入</text><text x="800" y="287" class="small" text-anchor="middle">协调两个 Worker 的资源</text><text x="800" y="319" class="small" text-anchor="middle">减少部分启动后的等待占用</text><text x="800" y="351" class="small" text-anchor="middle">不保证同时完成初始化</text></g><g><rect x="1080" y="205" width="440" height="235" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="1300" y="247" class="label" text-anchor="middle">拓扑约束</text><text x="1300" y="287" class="small" text-anchor="middle">两台可用节点能否同域？</text><text x="1300" y="319" class="small" text-anchor="middle">hard：必须满足边界</text><text x="1300" y="351" class="small" text-anchor="middle">soft：尽量满足偏好</text></g><path d="M520 320 L575 320" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1020 320 L1075 320" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="210" y="570" width="1180" height="160" rx="20" fill="url(#purple)" stroke="#a882ff" stroke-width="2"/><text x="800" y="612" class="label" text-anchor="middle">排队原因要分别记录</text><text x="800" y="652" class="small" text-anchor="middle">配额不足 / 没有完整八卡节点 / 最小任务集合不足 / 拓扑域不满足</text></g><text x="70" y="850" class="sub">整机分配保护八卡域完整性；回填、公平性与碎片控制仍需配套设计</text></svg>
