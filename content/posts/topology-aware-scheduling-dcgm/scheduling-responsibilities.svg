<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#15112d"/></linearGradient><linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0d5260"/></linearGradient><linearGradient id="purple" x2="1" y2="1"><stop stop-color="#33235f"/><stop offset="1" stop-color="#50306d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#48d7e8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#eaf6ff}.title{font-size:38px;font-weight:700}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#c4d5e5}.sub{font-size:23px;fill:#9fb7ca}</style></defs><rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="70" y="78" class="title">从请求到实际通信：四层职责与验证</text><text x="70" y="123" class="sub">逻辑流程 · 控制面分配资源，运行时建立连接</text><g><rect x="70" y="230" width="330" height="220" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="235" y="272" class="label" text-anchor="middle">① 作业准入</text><text x="235" y="312" class="small" text-anchor="middle">队列 / 配额 / 优先级</text><text x="235" y="344" class="small" text-anchor="middle">Gang 最小运行集合</text><text x="235" y="376" class="small" text-anchor="middle">能否进入运行集合？</text></g><g><rect x="450" y="230" width="330" height="220" rx="20" fill="url(#purple)" stroke="#a882ff" stroke-width="2"/><text x="615" y="272" class="label" text-anchor="middle">② 节点选择</text><text x="615" y="312" class="small" text-anchor="middle">可分配资源 / 网络域</text><text x="615" y="344" class="small" text-anchor="middle">硬约束与软偏好</text><text x="615" y="376" class="small" text-anchor="middle">两个 Pod 放在哪里？</text></g><g><rect x="830" y="230" width="330" height="220" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="995" y="272" class="label" text-anchor="middle">③ 节点内分配</text><text x="995" y="312" class="small" text-anchor="middle">kubelet / 设备插件</text><text x="995" y="344" class="small" text-anchor="middle">CPU / 内存 / 拓扑提示</text><text x="995" y="376" class="small" text-anchor="middle">分到哪些设备？</text></g><g><rect x="1210" y="230" width="320" height="220" rx="20" fill="url(#purple)" stroke="#a882ff" stroke-width="2"/><text x="1370" y="272" class="label" text-anchor="middle">④ 训练运行</text><text x="1370" y="312" class="small" text-anchor="middle">torchrun / DDP / NCCL</text><text x="1370" y="344" class="small" text-anchor="middle">可见 GPU / HCA / 算法</text><text x="1370" y="376" class="small" text-anchor="middle">数据实际怎样走？</text></g><path d="M400 340 L445 340" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M780 340 L825 340" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1160 340 L1205 340" fill="none" stroke="#48d7e8" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="220" y="570" width="1160" height="150" rx="20" fill="url(#cyan)" stroke="#48d7e8" stroke-width="2"/><text x="800" y="612" class="label" text-anchor="middle">保存实际结果，而不仅是资源请求</text><text x="800" y="652" class="small" text-anchor="middle">Job → Pod UID → Node → GPU UUID → CPU / RNIC → Rail / Fabric</text></g><text x="70" y="850" class="sub">传统 Device Plugin 路径示意；DRA 等机制应按安装版本核对职责与接口</text></svg>
