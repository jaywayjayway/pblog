<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#15112d"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0d6270"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#33235f"/><stop offset="1" stop-color="#5a3278"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#48d7e8"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#eaf6ff}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#9fb7ca}.label{font-size:24px;font-weight:650}.small{font-size:19px;fill:#b8c9d8}.box{stroke:#47d7e8;stroke-width:2}.path{fill:none;stroke:#48d7e8;stroke-width:7;marker-end:url(#arrow)}.alt{fill:none;stroke:#a882ff;stroke-width:5}.dead{fill:none;stroke:#ff668f;stroke-width:7;stroke-dasharray:18 12}</style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="78" class="title">单条上联故障：ECMP 有备用路径，不代表训练无感</text>
  <text x="80" y="118" class="sub">独立 routed link · 每条 /31 + eBGP · Plane A / Rail 2</text>

  <g transform="translate(80 170)">
    <rect width="690" height="630" rx="24" fill="#0b1c31" stroke="#253e56"/>
    <text x="32" y="48" class="label">故障前：4 个等价下一跳</text>
    <rect x="55" y="480" width="170" height="78" rx="16" fill="url(#cyan)" class="box"/><text x="140" y="527" text-anchor="middle" class="label">Leaf A01</text>
    <rect x="465" y="480" width="170" height="78" rx="16" fill="url(#cyan)" class="box"/><text x="550" y="527" text-anchor="middle" class="label">Leaf A06</text>
    <g fill="url(#purple)" stroke="#a882ff" stroke-width="2">
      <rect x="45" y="125" width="125" height="68" rx="14"/><rect x="205" y="125" width="125" height="68" rx="14"/>
      <rect x="365" y="125" width="125" height="68" rx="14"/><rect x="525" y="125" width="125" height="68" rx="14"/>
    </g>
    <g class="small" text-anchor="middle"><text x="107" y="167">Spine 1</text><text x="267" y="167">Spine 2</text><text x="427" y="167">Spine 3</text><text x="587" y="167">Spine 4</text></g>
    <path d="M140 480 L107 193 L550 480" class="alt"/><path d="M140 480 L267 193 L550 480" class="path" filter="url(#glow)"/>
    <path d="M140 480 L427 193 L550 480" class="alt"/><path d="M140 480 L587 193 L550 480" class="alt"/>
    <rect x="145" y="280" width="395" height="92" rx="16" fill="#10243b" stroke="#36506a"/>
    <text x="342" y="316" text-anchor="middle" class="small">QP 哈希命中 Spine 2</text>
    <text x="342" y="348" text-anchor="middle" class="small">AllReduce 正在传输</text>
  </g>

  <g transform="translate(830 170)">
    <rect width="690" height="630" rx="24" fill="#0b1c31" stroke="#253e56"/>
    <text x="32" y="48" class="label">故障后：成员退出，流量重映射</text>
    <rect x="55" y="480" width="170" height="78" rx="16" fill="url(#cyan)" class="box"/><text x="140" y="527" text-anchor="middle" class="label">Leaf A01</text>
    <rect x="465" y="480" width="170" height="78" rx="16" fill="url(#cyan)" class="box"/><text x="550" y="527" text-anchor="middle" class="label">Leaf A06</text>
    <g fill="url(#purple)" stroke="#a882ff" stroke-width="2">
      <rect x="45" y="125" width="125" height="68" rx="14"/><rect x="205" y="125" width="125" height="68" rx="14" opacity=".45"/>
      <rect x="365" y="125" width="125" height="68" rx="14"/><rect x="525" y="125" width="125" height="68" rx="14"/>
    </g>
    <g class="small" text-anchor="middle"><text x="107" y="167">Spine 1</text><text x="267" y="167" fill="#ff8cab">Spine 2</text><text x="427" y="167">Spine 3</text><text x="587" y="167">Spine 4</text></g>
    <path d="M140 480 L267 193" class="dead"/><path d="M247 278 l40 40 m0-40 l-40 40" stroke="#ff668f" stroke-width="9"/>
    <path d="M140 480 L427 193 L550 480" class="path" filter="url(#glow)"/>
    <path d="M140 480 L107 193 L550 480" class="alt"/><path d="M140 480 L587 193 L550 480" class="alt"/>
    <rect x="110" y="280" width="470" height="112" rx="16" fill="#10243b" stroke="#36506a"/>
    <text x="345" y="316" text-anchor="middle" class="small">FIB 删除失效下一跳</text>
    <text x="345" y="348" text-anchor="middle" class="small">受影响流改走 Spine 3</text>
    <text x="345" y="378" text-anchor="middle" class="small" fill="#ffbf72">剩余路径承担额外负载</text>
  </g>
  <text x="800" y="850" text-anchor="middle" class="sub">链路冗余只证明“还有路”；QP、Collective 与训练是否继续，必须分别验证</text>
</svg>
