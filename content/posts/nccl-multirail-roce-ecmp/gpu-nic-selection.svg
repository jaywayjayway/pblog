<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">先看亲和，再看 NCCL 使用了哪些网卡</title><desc id="desc">延续双机模型：实线为原理路径；PCIe、NVLink 和 RNIC 落点需以实机验证。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e879f9"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><style>.title{font:700 36px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 24px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:500 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#cbd5e1}</style></defs><rect width="1600" height="900" rx="32" fill="url(#bg)"/><g opacity=".08" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g><text x="65" y="70" class="title" text-anchor="start">先看亲和，再看 NCCL 使用了哪些网卡</text><text x="65" y="110" class="sub" text-anchor="start">延续双机模型：实线为原理路径；PCIe、NVLink 和 RNIC 落点需以实机验证。</text><rect x="70" y="180" width="680" height="100" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="410" y="216" class="head" text-anchor="middle">node-a · 多 GPU / 多 HCA</text><text x="410" y="250" class="label" text-anchor="middle">候选设备集合由 NCCL_IB_HCA 限定</text><rect x="850" y="180" width="680" height="100" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="1190" y="216" class="head" text-anchor="middle">node-b · 对应 Rail</text><text x="1190" y="250" class="label" text-anchor="middle">设备编号可能与 node-a 不同</text><rect x="95" y="340" width="270" height="110" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="230" y="376" class="head" text-anchor="middle">GPU A</text><text x="230" y="410" class="label" text-anchor="middle">近端 PCIe</text><rect x="455" y="340" width="270" height="110" rx="20" fill="#0c2035" stroke="#34d399" stroke-width="2"/><text x="590" y="376" class="head" text-anchor="middle">中间 GPU</text><text x="590" y="410" class="label" text-anchor="middle">PXN 候选</text><path d="M365 395 L455 395" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#green)"/><text x="410" y="370" class="sub" text-anchor="middle">NVLink</text><rect x="95" y="540" width="270" height="110" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="230" y="576" class="head" text-anchor="middle">近端 RNIC</text><text x="230" y="610" class="label" text-anchor="middle">直接路径 / GDR 条件</text><rect x="455" y="540" width="270" height="110" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="590" y="576" class="head" text-anchor="middle">另一 RNIC</text><text x="590" y="610" class="label" text-anchor="middle">借中间 GPU 到达</text><path d="M230 450 L230 540" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><path d="M590 450 L590 540" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#green)"/><rect x="920" y="370" width="530" height="130" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="1185" y="406" class="head" text-anchor="middle">远端 RNIC → GPU</text><text x="1185" y="440" class="label" text-anchor="middle">本端亲和 + 对端可达性</text><text x="1185" y="469" class="label" text-anchor="middle">共同影响最终通信图</text><path d="M725 595 L920 460" fill="none" stroke="#e879f9" stroke-width="4" marker-end="url(#pink)"/><text x="1100" y="590" class="label" text-anchor="middle">经可达的 RoCE Fabric</text><rect x="230" y="735" width="1140" height="105" rx="20" fill="#0c2035" stroke="#f59e0b" stroke-width="2"/><text x="800" y="771" class="head" text-anchor="middle">限制 HCA 会同时改变 GPU 到 NIC 的路径</text><text x="800" y="805" class="label" text-anchor="middle">单 HCA 与八 HCA 的时间差，包含共享资源与拓扑距离变化</text><path d="M365 595 L420 595 L420 675 L800 675 L920 480" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/></svg>
