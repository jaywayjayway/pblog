<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">从 GPU 到 Fabric：两个位置决定数据怎样分配</title><desc id="desc">主机选择设备与连接；交换机根据路由与哈希字段转发。图中箭头表达关系，不是一一映射。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e879f9"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><style>.title{font:700 36px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 24px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:500 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#cbd5e1}</style></defs><rect width="1600" height="900" rx="32" fill="url(#bg)"/><g opacity=".08" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g><text x="65" y="70" class="title" text-anchor="start">从 GPU 到 Fabric：两个位置决定数据怎样分配</text><text x="65" y="110" class="sub" text-anchor="start">主机选择设备与连接；交换机根据路由与哈希字段转发。图中箭头表达关系，不是一一映射。</text><rect x="65" y="180" width="660" height="150" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="395" y="216" class="head" text-anchor="middle">node-a · rank 0–7</text><text x="395" y="250" class="label" text-anchor="middle">GPU / NCCL Channels</text><text x="395" y="279" class="label" text-anchor="middle">结合拓扑组织并行通信工作</text><rect x="875" y="180" width="660" height="150" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="1205" y="216" class="head" text-anchor="middle">node-b · rank 8–15</text><text x="1205" y="250" class="label" text-anchor="middle">GPU / NCCL Channels</text><text x="1205" y="279" class="label" text-anchor="middle">远端连接与通信图共同约束选择</text><rect x="65" y="390" width="660" height="150" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="395" y="426" class="head" text-anchor="middle">候选 HCA → 网络连接 → 多个 QP</text><text x="395" y="460" class="label" text-anchor="middle">mlx5_0 … mlx5_7</text><text x="395" y="489" class="label" text-anchor="middle">同一 HCA 可服务多个连接；QP 数量依版本与后端</text><rect x="875" y="390" width="660" height="150" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="1205" y="426" class="head" text-anchor="middle">远端 HCA / QP</text><text x="1205" y="460" class="label" text-anchor="middle">设备索引需结合本端枚举表</text><text x="1205" y="489" class="label" text-anchor="middle">对应编号不自动代表相同物理 Rail</text><path d="M395 330 L395 390" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><path d="M1205 390 L1205 330" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><rect x="380" y="640" width="840" height="150" rx="20" fill="#0c2035" stroke="#e879f9" stroke-width="2"/><text x="800" y="676" class="head" text-anchor="middle">Leaf → 等价下一跳 → Spine → 远端 Leaf</text><text x="800" y="710" class="label" text-anchor="middle">RoCEv2 外层 IP / UDP 字段参与散列</text><text x="800" y="739" class="label" text-anchor="middle">Rail 是路径分组；Plane 是否隔离由实际网络决定</text><path d="M395 540 L570 640" fill="none" stroke="#e879f9" stroke-width="4" marker-end="url(#pink)"/><path d="M1030 640 L1205 540" fill="none" stroke="#e879f9" stroke-width="4" marker-end="url(#pink)"/></svg>
