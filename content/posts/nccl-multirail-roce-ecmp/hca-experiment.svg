<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">保持双机 16 Rank，逐级扩大 HCA 候选集合</title><desc id="desc">待执行实验：先固定 QP=8、GDR=LOC，记录实际选路变化。所有带宽结果留待测量。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e879f9"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><style>.title{font:700 36px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 24px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:500 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#cbd5e1}</style></defs><rect width="1600" height="900" rx="32" fill="url(#bg)"/><g opacity=".08" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g><text x="65" y="70" class="title" text-anchor="start">保持双机 16 Rank，逐级扩大 HCA 候选集合</text><text x="65" y="110" class="sub" text-anchor="start">待执行实验：先固定 QP=8、GDR=LOC，记录实际选路变化。所有带宽结果留待测量。</text><rect x="75" y="180" width="700" height="120" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="425" y="216" class="head" text-anchor="middle">node-a：8 Rank / 8 GPU</text><text x="425" y="250" class="label" text-anchor="middle">每个 MPI 进程一张 GPU；消息范围 8 B～1 GiB</text><rect x="825" y="180" width="700" height="120" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="1175" y="216" class="head" text-anchor="middle">node-b：8 Rank / 8 GPU</text><text x="1175" y="250" class="label" text-anchor="middle">相同软件栈、数据类型、重复次数与网络策略</text><rect x="70" y="410" width="290" height="180" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="215" y="446" class="head" text-anchor="middle">1 HCA</text><text x="215" y="480" class="label" text-anchor="middle">确认实际活跃端口</text><text x="215" y="509" class="label" text-anchor="middle">记录 GPU-NIC 距离</text><text x="215" y="538" class="label" text-anchor="middle">完成时间 / 带宽：待测</text><rect x="460" y="410" width="290" height="180" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="605" y="446" class="head" text-anchor="middle">2 HCA</text><text x="605" y="480" class="label" text-anchor="middle">确认实际活跃端口</text><text x="605" y="509" class="label" text-anchor="middle">记录 GPU-NIC 距离</text><text x="605" y="538" class="label" text-anchor="middle">完成时间 / 带宽：待测</text><rect x="850" y="410" width="290" height="180" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="995" y="446" class="head" text-anchor="middle">4 HCA</text><text x="995" y="480" class="label" text-anchor="middle">确认实际活跃端口</text><text x="995" y="509" class="label" text-anchor="middle">记录 GPU-NIC 距离</text><text x="995" y="538" class="label" text-anchor="middle">完成时间 / 带宽：待测</text><rect x="1240" y="410" width="290" height="180" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="1385" y="446" class="head" text-anchor="middle">8 HCA</text><text x="1385" y="480" class="label" text-anchor="middle">确认实际活跃端口</text><text x="1385" y="509" class="label" text-anchor="middle">记录 GPU-NIC 距离</text><text x="1385" y="538" class="label" text-anchor="middle">完成时间 / 带宽：待测</text><path d="M360 495 L460 495" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><path d="M750 495 L850 495" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><path d="M1140 495 L1240 495" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><rect x="160" y="700" width="1280" height="135" rx="20" fill="#0c2035" stroke="#34d399" stroke-width="2"/><text x="800" y="736" class="head" text-anchor="middle">后续单独对照：GDR 自动选择；QP 数量 1 / 2 / 4 / 8</text><text x="800" y="770" class="label" text-anchor="middle">每组至少独立启动 5 次，保存中位数与极差；不以 5 次样本声称 P99</text><text x="800" y="799" class="label" text-anchor="middle">两端 HCA 集合按实际亲和选取；网卡名字一致不是实验前提</text></svg>
