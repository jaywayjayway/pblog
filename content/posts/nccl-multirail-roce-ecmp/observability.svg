<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">把 NCCL、RNIC 与交换机放到同一时间轴</title><desc id="desc">关联键：实验轮次 / 节点 / Rank / GPU / HCA 端口 / netdev / Rail / 交换机端口。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e879f9"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><style>.title{font:700 36px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 24px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:500 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#cbd5e1}</style></defs><rect width="1600" height="900" rx="32" fill="url(#bg)"/><g opacity=".08" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g><text x="65" y="70" class="title" text-anchor="start">把 NCCL、RNIC 与交换机放到同一时间轴</text><text x="65" y="110" class="sub" text-anchor="start">关联键：实验轮次 / 节点 / Rank / GPU / HCA 端口 / netdev / Rail / 交换机端口。</text><rect x="70" y="185" width="680" height="130" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="410" y="221" class="head" text-anchor="middle">node-a · NCCL / GPU</text><text x="410" y="255" class="label" text-anchor="middle">完成时间、algbw / busbw、实际连接</text><text x="410" y="284" class="label" text-anchor="middle">GPU-NIC 距离、PCIe / NVLink 指标</text><rect x="850" y="185" width="680" height="130" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="1190" y="221" class="head" text-anchor="middle">node-b · NCCL / GPU</text><text x="1190" y="255" class="label" text-anchor="middle">对端完成与接收路径</text><text x="1190" y="284" class="label" text-anchor="middle">算法阶段与慢 Rank</text><rect x="70" y="390" width="680" height="130" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="410" y="426" class="head" text-anchor="middle">发送 RNIC</text><text x="410" y="460" class="label" text-anchor="middle">逐端口 TX 增量、CNP、PFC、重传</text><text x="410" y="489" class="label" text-anchor="middle">确认计数器单位和时间窗口</text><rect x="850" y="390" width="680" height="130" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="1190" y="426" class="head" text-anchor="middle">接收 RNIC</text><text x="1190" y="460" class="label" text-anchor="middle">逐端口 RX 增量、错误与设备健康</text><text x="1190" y="489" class="label" text-anchor="middle">TX 与远端 RX 不重复相加</text><path d="M410 315 L410 390" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><path d="M1190 390 L1190 315" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><rect x="350" y="610" width="900" height="145" rx="20" fill="#0c2035" stroke="#e879f9" stroke-width="2"/><text x="800" y="646" class="head" text-anchor="middle">Leaf / Spine · Fabric</text><text x="800" y="680" class="label" text-anchor="middle">等价路径、上联分布、队列水位、CE / PFC / Drop</text><text x="800" y="709" class="label" text-anchor="middle">区分共享业务与本次测试流量；秒级采样看不到全部微突发</text><path d="M410 520 L610 610" fill="none" stroke="#e879f9" stroke-width="4" marker-end="url(#pink)"/><path d="M990 610 L1190 520" fill="none" stroke="#e879f9" stroke-width="4" marker-end="url(#pink)"/><text x="800" y="835" class="label" text-anchor="middle">以性能退化 + 路径证据 + 端口异常共同定位；CE/CNP 非零本身不是故障</text></svg>
