<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">多 QP 提供散列机会，ECMP 仍可能碰撞</title><desc id="desc">假设 node-a 与 node-b 位于不同 Leaf；哈希结果仅作示意，不代表实测。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#121a38"/></linearGradient><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e879f9"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><style>.title{font:700 36px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.sub{font:400 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#94a3b8}.head{font:700 24px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#f8fafc}.label{font:500 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#cbd5e1}</style></defs><rect width="1600" height="900" rx="32" fill="url(#bg)"/><g opacity=".08" stroke="#60a5fa"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g><text x="65" y="70" class="title" text-anchor="start">多 QP 提供散列机会，ECMP 仍可能碰撞</text><text x="65" y="110" class="sub" text-anchor="start">假设 node-a 与 node-b 位于不同 Leaf；哈希结果仅作示意，不代表实测。</text><rect x="60" y="185" width="340" height="145" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="230" y="221" class="head" text-anchor="middle">node-a · RNIC</text><text x="230" y="255" class="label" text-anchor="middle">QP A / QP B / QP C</text><text x="230" y="284" class="label" text-anchor="middle">RoCEv2 UDP dst = 4791</text><text x="230" y="313" class="label" text-anchor="middle">源端口提供流标识</text><rect x="520" y="185" width="440" height="145" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="740" y="221" class="head" text-anchor="middle">Leaf A · ECMP</text><text x="740" y="255" class="label" text-anchor="middle">检查外层 IP / UDP 哈希字段</text><text x="740" y="284" class="label" text-anchor="middle">先确认等价下一跳存在</text><path d="M400 255 L520 255" fill="none" stroke="#e879f9" stroke-width="4" marker-end="url(#pink)"/><rect x="1100" y="185" width="440" height="145" rx="20" fill="#0c2035" stroke="#a78bfa" stroke-width="2"/><text x="1320" y="221" class="head" text-anchor="middle">node-b · RNIC</text><text x="1320" y="255" class="label" text-anchor="middle">经 Leaf B 接收</text><text x="1320" y="284" class="label" text-anchor="middle">图中合并远端 Leaf 以简化</text><rect x="140" y="470" width="360" height="130" rx="20" fill="#0c2035" stroke="#e879f9" stroke-width="2"/><text x="320" y="506" class="head" text-anchor="middle">Spine 0</text><text x="320" y="540" class="label" text-anchor="middle">QP A 与 QP B 落到同一路径</text><text x="320" y="569" class="label" text-anchor="middle">多个流也可能发生碰撞</text><rect x="620" y="470" width="360" height="130" rx="20" fill="#0c2035" stroke="#22d3ee" stroke-width="2"/><text x="800" y="506" class="head" text-anchor="middle">Spine 1</text><text x="800" y="540" class="label" text-anchor="middle">QP C 落到另一条路径</text><text x="800" y="569" class="label" text-anchor="middle">不保证各路径字节量相等</text><rect x="1100" y="470" width="360" height="130" rx="20" fill="#0c2035" stroke="#64748b" stroke-width="2"/><text x="1280" y="506" class="head" text-anchor="middle">Spine 2</text><text x="1280" y="540" class="label" text-anchor="middle">本组示例没有流命中</text><text x="1280" y="569" class="label" text-anchor="middle">可达不等于实际使用</text><path d="M660 330 L320 470" fill="none" stroke="#e879f9" stroke-width="4" marker-end="url(#pink)"/><path d="M740 330 L800 470" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><path d="M960 550 L1180 330" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyan)"/><path d="M500 575 L550 575 L550 380 L1150 330" fill="none" stroke="#e879f9" stroke-width="4" marker-end="url(#pink)"/><rect x="190" y="725" width="1220" height="120" rx="20" fill="#0c2035" stroke="#f59e0b" stroke-width="2"/><text x="800" y="761" class="head" text-anchor="middle">增加 QP → 验证流标识变化 → 检查上联分布 → 比较完成时间</text><text x="800" y="795" class="label" text-anchor="middle">普通按流 ECMP 不会因队列繁忙自动改路；自适应机制需要单独验证</text></svg>
